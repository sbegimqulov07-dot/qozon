or ustida pishgan tuxum — o'zbek nonushtasi.`,ingredients:[{id:`tuxum`,qty:3},{id:`pomidor`,qty:200},{id:`piyoz`,qty:60},{id:`yog`,qty:20},{id:`non`,qty:150},{id:`tuz`,qty:3},{id:`murch`,qty:.5,opt:!0}],steps:[{t:`Yarim piyozni yarim halqa qilib yupqa to'g'rang. Pomidorni 1 sm kubik qiling.`},{t:`Tovaga 20 ml yog' quyib qizdiring, piyozni solib 3 daqiqa shaffof bo'lguncha qovuring.`,timer:3},{t:`Pomidorni qo'shing, tuz seping. 5 daqiqa, pomidor suvi yarim qaynab ketguncha qovuring.`,timer:5,why:`Suvi ko'p qolsa tuxum suyuq bo'ladi.`},{t:`Pomidor ustiga 3 ta tuxumni chaqing. Xohlasangiz aralashtiring (bo'tqa kabi) yoki butun qoldiring.`},{t:`Qopqoqni yopib, past olovda 4 daqiqa pishiring.`,timer:4},{t:`Murch sepib, issiq non bilan torting.`}],tools:[`Tova`,`Qopqoq`],tags:[`arzon`]},{id:`kartoshkali_tuxum`,name:`Kartoshkali tuxum qovurma`,cat:`nonushta`,meals:fe(`main`,`ok`,`main`),time:25,difficulty:1,servings:1,desc:`Qovurilgan kartoshka ustiga tuxum — juda to'yimli.`,ingredients:[{id:`kartoshka`,qty:300},{id:`tuxum`,qty:2},{id:`piyoz`,qty:60},{id:`yog`,qty:35},{id:`non`,qty:80},{id:`tuz`,qty:3}],steps:[{t:`Kartoshkani archib, 5 mm qalinlikda tayoqcha qilib to'g'rang. Sovuq suvda chayib, sochiq bilan quriting.`,why:`Quruq kartoshka yopishmaydi va qizarib qovuriladi.`},{t:`Tovaga yog' quyib kuchli olovda qizdiring (tutun chiqa boshlaguncha emas, lekin yaxshi qizisin).`},{t:`Kartoshkani bir qavat qilib yoying. 5 daqiqa tegmang — pastki tomoni qizarsin.`,timer:5},{t:`Ag'daring, piyozni qo'shing, olovni o'rtaga tushiring. Yana 7 daqiqa, 2 marta aralashtirib qovuring.`,timer:7},{t:`Tuz seping. Kartoshka orasida 2 ta chuqurcha ochib, tuxumlarni chaqing. Qopqoq yopib 4 daqiqa.`,timer:4},{t:`Non bilan issiq holda yeng.`}],tools:[`Tova`,`Qopqoq`],tags:[`arzon`,`toyimli`]},{id:`suli_botqasi`,name:`Sutli suli bo'tqasi (banan, yong'oq)`,cat:`nonushta`,meals:fe(`main`,`no`,`no`),time:10,difficulty:1,servings:1,ingredients:[{id:`suli`,qty:90},{id:`sut`,qty:300},{id:`shakar`,qty:15},{id:`sariyog`,qty:10},{id:`banan`,qty:1},{id:`yongoq`,qty:20,opt:!0},{id:`tuz`,qty:1}],steps:[{t:`Kichik qozonchaga 300 ml sut quyib, o'rta olovda qaynash arafasiga keltiring (chetida pufakchalar chiqsa bo'ldi).`},{t:`Suli yormasini, chimdim tuz va shakarni solib aralashtiring. Olovni pastga tushiring.`},{t:`5 daqiqa, har daqiqada bir aralashtirib pishiring. Quyuqlashsa — tayyor.`,timer:5,why:`Aralashtirmasangiz tubiga yopishadi.`},{t:`O'chiring, sariyog' solib aralashtiring. Qopqoq yopib 2 daqiqa dam bering.`,timer:2},{t:`Kosaga soling, ustiga bananni halqa qilib kesib, yong'oqni maydalab seping.`}],tools:[`Kichik qozon`],tags:[`tez`,`arzon`]},{id:`manniy_botqa`,name:`Manniy bo'tqa`,cat:`nonushta`,meals:fe(`main`,`no`,`no`),time:10,difficulty:1,servings:1,ingredients:[{id:`manniy`,qty:60},{id:`sut`,qty:350},{id:`shakar`,qty:20},{id:`sariyog`,qty:15},{id:`tuz`,qty:1},{id:`mayiz`,qty:20,opt:!0}],steps:[{t:`Sutni qozonchada o'rta olovda qizdiring, shakar va chimdim tuz soling.`},{t:`Sut qaynay boshlaganda manniyni ingichka oqim bilan, to'xtovsiz aralashtirib soling.`,why:`Bir yo'la solinsa — tugunak bo'lib qoladi.`},{t:`Past olovda 4 daqiqa aralashtirib pishiring.`,timer:4},{t:`O'chiring, sariyog' va mayiz qo'shing, qopqoq yopib 3 daqiqa qoldiring — bo'tqa quyuqlashadi.`,timer:3}],tools:[`Kichik qozon`],tags:[`tez`,`arzon`]},{id:`shirguruch`,name:`Shirguruch (sutli guruch bo'tqasi)`,cat:`nonushta`,meals:fe(`main`,`no`,`no`),time:35,difficulty:1,servings:2,desc:`2 porsiya chiqadi — ertaga ham yeysiz, sovuq holda ham mazali.`,ingredients:[{id:`guruch`,qty:180},{id:`sut`,qty:800},{id:`shakar`,qty:40},{id:`sariyog`,qty:30},{id:`tuz`,qty:2},{id:`mayiz`,qty:40,opt:!0}],steps:[{t:`Guruchni 3 marta suv tiniguncha yuving.`},{t:`Qozonchaga guruch va 300 ml suv soling, qaynagach past olovda 10 daqiqa suvni shimguncha pishiring.`,timer:10,why:`Avval suvda, keyin sutda — sut kuymaydi.`},{t:`Sutni, tuz va shakarni qo'shing. Qaynagach olovni eng pastga tushiring.`},{t:`20 daqiqa, har 4–5 daqiqada aralashtirib pishiring. Guruch butunlay yumshab, bo'tqa quyuqlashsin.`,timer:20},{t:`Sariyog' va mayiz qo'shib aralashtiring, 5 daqiqa dam bering.`,timer:5}],tools:[`Qozoncha`],tags:[`arzon`,`batch`],leftover:`Sovuq shirguruchni ertalab sut qo'shib isiting.`},{id:`grechka_sutli`,name:`Grechka sut bilan`,cat:`nonushta`,meals:fe(`main`,`no`,`ok`),time:20,difficulty:1,servings:1,ingredients:[{id:`grechka`,qty:100},{id:`sut`,qty:300},{id:`sariyog`,qty:15},{id:`shakar`,qty:10},{id:`tuz`,qty:1}],steps:[{t:`Grechkani yuving. Qozonchaga 200 ml suv va chimdim tuz bilan soling.`},{t:`Qaynagach past olovda qopqoq yopiq holda 15 daqiqa pishiring. Suv to'liq shimilsin.`,timer:15},{t:`Sariyog' qo'shib aralashtiring. Kosaga soling, ustidan iliq sut quying, shakar seping.`}],tools:[`Qozoncha`],tags:[`arzon`]},{id:`quymoq`,name:`Quymoq (yupqa blinchik)`,cat:`nonushta`,meals:fe(`main`,`no`,`no`),time:30,difficulty:2,servings:1,desc:`6–7 ta quymoq. Smetana yoki asal bilan.`,ingredients:[{id:`un`,qty:130},{id:`sut`,qty:300},{id:`tuxum`,qty:1},{id:`shakar`,qty:20},{id:`yog`,qty:25},{id:`tuz`,qty:1},{id:`smetana`,qty:50,opt:!0},{id:`asal`,qty:20,opt:!0}],steps:[{t:`Kosada tuxum, shakar, tuzni ko'pirguncha chaling. Sutning yarmini quyib aralashtiring.`},{t:`Unni elakdan o'tkazib (yoki qoshiq bilan sepib) qo'shing, tugunaksiz bo'lguncha aralashtiring. Qolgan sutni va 1 osh qoshiq yog' qo'shing.`,why:`Xamir suyuq qaymoq kabi bo'lishi kerak.`},{t:`Xamirni 10 daqiqa tindiring.`,timer:10,why:`Un shishadi, quymoq yirtilmaydi.`},{t:`Tovani kuchli olovda yaxshi qizdiring, yog' bilan yupqa moylang (sochiq bo'lagi bilan).`},{t:`Yarim cho'mich xamir quyib, tovani aylantirib yupqa yoying. 1 daqiqa — chetlari ko'tarilsa ag'daring, yana 30 soniya.`,timer:1},{t:`Har safar tovani yupqa moylab davom eting. Tayyor quymoqlarni ustma-ust taxlang.`},{t:`Smetana yoki asal bilan o'rab yeng.`}],tools:[`Tova`,`Kosa`,`Cho'mich`],tags:[`arzon`]},{id:`grenki`,name:`Tuxumli non (grenki)`,cat:`nonushta`,meals:fe(`main`,`no`,`no`,`ok`),time:10,difficulty:1,servings:1,desc:`Qotgan nonni ishlatishning eng yaxshi yo'li.`,ingredients:[{id:`non`,qty:150},{id:`tuxum`,qty:2},{id:`sut`,qty:60},{id:`shakar`,qty:10},{id:`yog`,qty:20},{id:`tuz`,qty:1}],steps:[{t:`Nonni 1,5 sm qalinlikda 4–5 bo'lak qilib kesing.`},{t:`Chuqur likopchada tuxum, sut, shakar va chimdim tuzni vilka bilan chaling.`},{t:`Tovaga yog' quyib o'rta olovda qizdiring.`},{t:`Har bo'lak nonni aralashmaga ikki tomonlama 3 soniya botirib, tovaga qo'ying. Har tomonini 2 daqiqa, oltin rang bo'lguncha qovuring.`,timer:2},{t:`Asal, murabbo yoki shunchaki choy bilan.`}],tools:[`Tova`],tags:[`tez`,`arzon`]},{id:`syrniki`,name:`Syrniki (tvorog kotletchalari)`,cat:`nonushta`,meals:fe(`main`,`no`,`no`,`ok`),time:25,difficulty:2,servings:1,ingredients:[{id:`tvorog`,qty:250},{id:`tuxum`,qty:1},{id:`un`,qty:50},{id:`shakar`,qty:25},{id:`yog`,qty:25},{id:`tuz`,qty:1},{id:`smetana`,qty:50,opt:!0}],steps:[{t:`Tvorogni vilka bilan ezib silliqlang. Tuxum, shakar, tuz va 2 osh qoshiq un qo'shib aralashtiring. Xamir qo'lga yopishmasligi kerak — yopishsa yana 1 qoshiq un.`},{t:`Qo'lni unga botirib, xamirdan 6 ta sharcha yasang va 1,5 sm qalinlikda yassilang. Har tomonini unga bulang.`},{t:`Tovaga yog' quyib o'rta olovda qizdiring. Syrnikilarni qo'yib, har tomonini 3 daqiqa qizarguncha qovuring.`,timer:3},{t:`Olovni pastga tushirib, qopqoq yopiq holda yana 2 daqiqa — ichi pishsin.`,timer:2},{t:`Smetana yoki asal bilan torting.`}],tools:[`Tova`,`Kosa`],tags:[]},{id:`tvorog_qaymoq`,name:`Tvorog, smetana va banan`,cat:`nonushta`,meals:fe(`main`,`no`,`no`,`main`),time:3,difficulty:1,servings:1,ingredients:[{id:`tvorog`,qty:200},{id:`smetana`,qty:60},{id:`shakar`,qty:15},{id:`banan`,qty:1},{id:`non`,qty:80},{id:`yongoq`,qty:20,opt:!0}],steps:[{t:`Tvorogni kosaga soling, smetana va shakar bilan aralashtiring.`},{t:`Bananni halqa qilib kesib ustiga qo'ying, yong'oq seping. Non bilan yeng.`}],tools:[`Kosa`],tags:[`tez`]},{id:`non_sariy
